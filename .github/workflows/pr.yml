name: Pull Request Check
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - .gitignore
jobs:
  unit-tests:
    name: 'Unit tests in ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: ["alluvial-finance-k8s-runners"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Check out project files'
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-runner-tools
      - name: 'Setup go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: 'Run unit tests and generage HTML coverage report'
        run: |
          make unit-test-cov
  integration-tests:
    name: 'Integration tests in ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: ["alluvial-finance-k8s-runners"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-runner-tools
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: 'Pull postgres 14.4 docker image so it is available for integeration test'
        run: |
          docker pull postgres:14.4
      - name: 'Run integration tests and generage HTML coverage report'
        run: |
          make integration-test-cov

  lint:
    name: 'Linting tests'
    runs-on: alluvial-finance-k8s-runners
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: 'Run linting checks'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=2m
